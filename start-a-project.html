<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0; url=/contact.html#form">
  <link rel="canonical" href="/contact.html#form">
  <title>Redirecting — FunnelHaus</title>
  <meta name="robots" content="noindex, follow">
  <script>window.location.replace('/contact.html#form');</script>
</head>
<body>
  <p>Redirecting to <a href="/contact.html#form">contact</a>…</p>

  <script>
    (function () {
      var nav = document.querySelector('.nav');
      if (!nav) return;
      function updateNavTheme() {
        var els = document.elementsFromPoint(window.innerWidth / 2, 48);
        for (var i = 0; i < els.length; i++) {
          var el = els[i];
          if (el === nav || nav.contains(el)) continue;
          var bg = window.getComputedStyle(el).backgroundColor;
          if (bg && bg !== 'rgba(0, 0, 0, 0)' && bg !== 'transparent') {
            var m = bg.match(/\d+/g);
            if (m) {
              var lum = (0.299 * +m[0] + 0.587 * +m[1] + 0.114 * +m[2]) / 255;
              nav.classList.toggle('nav--light', lum > 0.65);
              return;
            }
          }
        }
      }
      window.addEventListener('scroll', updateNavTheme, { passive: true });
      updateNavTheme();
    })();
  </script>
</body>
</html>
