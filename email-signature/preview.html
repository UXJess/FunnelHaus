<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FunnelHaus email signature</title>
  <style>
    body { background: #fff; margin: 32px; font-family: Helvetica, Arial, sans-serif; color: #0D0C14; }

    section { margin: 0 0 40px; }
  </style>
</head>
<body>
  <section>
    <h2>Light</h2>
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:Helvetica,Arial,sans-serif;">
<tr>
  <td valign="middle" style="padding:0 16px 0 0;"><img src="https://www.funnelhaus.ca/assets/email/jessie.png" width="56" height="56" alt="Jessie Och" style="display:block;width:56px;height:56px;border-radius:50%;border:0;"></td>
  <td valign="middle">
    <img src="https://www.funnelhaus.ca/assets/email/name-light.gif" width="284" height="20" alt="Jessie Och | Founder | FunnelHaus" style="display:block;width:284px;height:20px;border:0;margin-left:-4px;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;margin-top:8px;"><tr><td valign="middle" style="padding:0 6px 0 0;"><img src="https://www.funnelhaus.ca/assets/email/icon-mail-ink.png" width="16" height="16" alt="Email" style="display:block;width:16px;height:16px;border:0;"></td><td valign="middle" style="padding:0 18px 0 0;font-size:13px;line-height:16px;white-space:nowrap;"><a href="mailto:hello@funnelhaus.ca" style="color:#0D0C14;text-decoration:none;">hello@funnelhaus.ca</a></td><td valign="middle" style="padding:0 6px 0 0;"><img src="https://www.funnelhaus.ca/assets/email/icon-web-ink.png" width="16" height="16" alt="Web" style="display:block;width:16px;height:16px;border:0;"></td><td valign="middle" style="padding:0 18px 0 0;font-size:13px;line-height:16px;white-space:nowrap;"><a href="https://funnelhaus.ca" style="color:#0D0C14;text-decoration:none;">funnelhaus.ca</a></td></tr></table>
  </td>
</tr>
</table>
  </section>
  <section>
    <h2>Dark</h2>
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" bgcolor="#070508" style="border-collapse:separate;background:#070508;border-radius:12px;"><tr><td style="padding:16px 24px 16px 16px;"><table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:Helvetica,Arial,sans-serif;">
<tr>
  <td valign="middle" style="padding:0 16px 0 0;"><img src="https://www.funnelhaus.ca/assets/email/jessie.png" width="56" height="56" alt="Jessie Och" style="display:block;width:56px;height:56px;border-radius:50%;border:0;box-shadow:0 0 0 2px #2C60F1;"></td>
  <td valign="middle">
    <img src="https://www.funnelhaus.ca/assets/email/name-dark.gif" width="284" height="20" alt="Jessie Och | Founder | FunnelHaus" style="display:block;width:284px;height:20px;border:0;margin-left:-4px;">

  </td>
</tr>
</table></td></tr></table>

</html>
